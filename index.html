<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSHD - Générateur de Documents Médicaux</title>
    <style>
        /* =============================
        STYLE GLOBAL PAGE
        ============================= */
       body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #1a1a1a;
    text-align: center;
    /* Ajoute un voilage blanc à 85% d'opacité sur l'image */
    background: linear-gradient(rgba(255, 255, 255, 0.50), rgba(255, 255, 255, 0.50)), 
                url('fond.png') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

        header { 
            padding: 50px 20px 20px 20px; 
            flex: 1;
        }

        .logo { 
            width: 120px; 
            margin-bottom: 15px; 
        }

       h1 { 
    font-size: 2.3em; 
    color: #ffffff; /* Texte en blanc pur */
    margin-bottom: 5px;
    margin-top: 0;
    /* Ombre noire sombre pour détacher le texte de l'image */
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8), 0 0 12px rgba(0, 0, 0, 0.6);
}

.subtitle {
    color: #ffffff; /* Texte en blanc pur */
    font-size: 1.1em;
    font-weight: bold;
    margin-top: 0;
    margin-bottom: 40px;
    /* Ombre noire sous le sous-titre */
    text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.8);
}

        /* =============================
        GRILLE DES CARTES DE MENU
        ============================= */
        .menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 25px 20px;
            width: 280px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            border: 2px solid transparent;
            text-align: center;
        }

        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 25px rgba(0, 159, 227, 0.2);
            border-color: #009fe3; /* Cyan tiré du logo sur survol */
        }

        .card-icon {
            font-size: 2.2em;
            margin-bottom: 12px;
        }

        .card-title {
            font-weight: bold;
            font-size: 1.05em;
            color: #0a3a6b;
            line-height: 1.3;
        }

        /* =============================
        BAS DE PAGE / DISCLAIMER GTA RP
        ============================= */
        footer {
    padding: 15px 20px;
    font-size: 11px;
    color: #ffffff; /* Texte du bas en blanc */
    text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
    letter-spacing: 0.3px;
}
    </style>
</head>
<body>

<header>
    <!-- Logo LSHD -->
    <img src="Logo.png" class="logo" alt="Logo LSHD">
    <h1>LSHD - Service Médical</h1>
    <p class="subtitle">Plateforme de Génération de Documents Officiels</p>

    <!-- SOMMAIRE DES DOCUMENTS -->
    <div class="menu">
    <div class="card" onclick="goTo('CERTIFICAT POUR COUPS ET BLESSURES VOLONTAIRES.html')">
        <div class="card-icon">📋</div>
        <div class="card-title">Certificat pour Coups & Blessures Volontaires</div>
    </div>
</div>
</header>

<!-- DISCLAIMER BAS DE PAGE -->
<footer>
    <p>Ce site et les documents générés sont strictement fictifs et exclusivement destinés au jeu de rôle (GTA RP sur LSC). Aucune valeur juridique ou médicale réelle.</p>
</footer>

<script>
    function goTo(page) {
        window.location.href = page;
    }
</script>

</body>
</html>
